<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquor Transaction Association Miner - Generated Rules</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f7f7;
            min-height: 100vh;
        }
        /* Media query to make table content more readable on small screens */
        @media (max-width: 900px) {
            .responsive-table th, .responsive-table td {
                display: block;
                width: 100%;
                text-align: right;
            }
            .responsive-table thead {
                display: none; /* Hide header row on mobile */
            }
            .responsive-table td {
                padding-left: 50%; /* Make space for the label */
                border-bottom: 1px solid #e5e7eb;
                position: relative;
            }
            .responsive-table td:before {
                content: attr(data-label);
                position: absolute;
                left: 1rem;
                width: 45%;
                text-align: left;
                font-weight: 600;
                color: #4f46e5;
            }
            /* Remove border from last cell in each row */
            .responsive-table tr:last-child td:last-child {
                border-bottom: none;
            }
        }
    </style>
</head>
<body class="text-gray-800">

    <!-- Navbar (Consistent with recommend.html) -->
    <nav class="bg-white shadow-lg sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <!-- Logo/App Name -->
                <div class="flex items-center">
                    <span class="text-2xl font-bold text-indigo-600">
                       <!-- LIQUOR GLASS LOGO SVG -->
                    <svg class="w-6 h-6 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <!-- Path for a simple liquor/wine glass -->
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 6L12 12L6 6M12 12V22M7 22H17"/>
                    </svg>
                        LTA Miner
                    </span>
                </div>
                <!-- Nav Links -->
                <div class="flex items-center space-x-4">
                    <a href="{{ url_for('rules.home') }}" class="text-gray-500 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium">Home</a>
                    <a href="{{ url_for('rules.recommend') }}" class="text-gray-500 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium">Get Recommendation</a>
                    <a href="{{ url_for('rules.rules') }}" class="text-indigo-600 font-bold px-3 py-2 rounded-md text-sm font-medium border-b-2 border-indigo-600">Rules</a>
                    <a href="{{ url_for('rules.about') }}" class="text-gray-500 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium">About</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-indigo-700 mb-8 border-b-2 border-indigo-200 pb-3">
            Generated Association Rules
        </h1>

        <!-- Rules Output Area -->
        <div id="rules-output">
            <!-- Content will be inserted by JavaScript -->
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-100 text-gray-800 mt-12 border-t border-gray-200">
        <div class="max-w-7xl mx-auto py-4 px-4 sm:px-6 lg:px-8 text-center text-sm text-gray-600">
            Liquor Transaction Association Miner &copy; 2024. Powered by Apriori.
        </div>
    </footer>

    <script>
        // Mock data to simulate the server-side generated 'rules' and 'error' variables
        const mockRules = [
            { rule: '{Vodka} → {Orange Juice}', support: '0.0051', confidence: '0.82', lift: '1.45' },
            { rule: '{Tequila} → {Lime}', support: '0.0048', confidence: '0.79', lift: '1.29' },
            { rule: '{Gin, Lemon} → {Tonic Water}', support: '0.0062', confidence: '0.75', lift: '1.55' },
            { rule: '{Bourbon Whiskey} → {Coca-Cola}', support: '0.0045', confidence: '0.72', lift: '1.38' },
            { rule: '{Scotch} → {Ice}', support: '0.0042', confidence: '0.55', lift: '1.15' },
            { rule: '{White Wine} → {Sparkling Water}', support: '0.0040', confidence: '0.48', lift: '1.11' },
            { rule: '{Rum} → {Pineapple Juice}', support: '0.0039', confidence: '0.45', lift: '1.10' },
        ];

        // Set mock error to null for successful display
        const mockError = null;
        // const mockError = "Database connection failed while fetching rules."; // Uncomment to test error view

        const rulesOutputDiv = document.getElementById('rules-output');

        if (mockError) {
            // Error Display
            rulesOutputDiv.innerHTML = `
                <div class="bg-red-100 text-red-700 p-4 rounded-lg border-l-4 border-red-500 font-medium shadow-md">
                    <strong class="font-bold">Error:</strong> ${mockError}
                </div>
            `;
        } else if (mockRules.length > 0) {
            // Display parameters summary
            let htmlContent = `
                <div class="bg-white p-6 rounded-xl shadow-md border-l-4 border-indigo-500 mb-6">
                    <p class="text-lg font-semibold text-gray-900 mb-2">Rule Generation Parameters</p>
                    <p class="text-gray-600">Found <strong>${mockRules.length}</strong> rules using the following minimum thresholds:</p>
                    <ul class="list-disc list-inside mt-2 text-gray-600 space-y-1">
                        <li><strong>Min Support</strong>: 0.004 (Frequency of items)</li>
                        <li><strong>Min Confidence</strong>: 0.25 (Likelihood of Consequent given Antecedent)</li>
                        <li><strong>Min Lift</strong>: 1.1 (Strength relative to random chance)</li>
                    </ul>
                </div>
            `;

            // Start responsive table generation
            htmlContent += `
                <div class="overflow-x-auto rounded-xl shadow-xl">
                    <table class="w-full responsive-table bg-white">
                        <thead>
                            <tr class="text-white bg-indigo-600 text-sm">
                                <th class="py-4 px-6 font-semibold uppercase tracking-wider rounded-tl-xl">Rule (Antecedent &rarr; Consequent)</th>
                                <th class="py-4 px-6 font-semibold uppercase tracking-wider">Support</th>
                                <th class="py-4 px-6 font-semibold uppercase tracking-wider">Confidence</th>
                                <th class="py-4 px-6 font-semibold uppercase tracking-wider rounded-tr-xl">Lift</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-200">
            `;

            // Loop through rules
            mockRules.forEach(rule => {
                htmlContent += `
                    <tr class="hover:bg-indigo-50 transition duration-150">
                        <td data-label="Rule (A &rarr; C)" class="py-4 px-6 text-left font-medium text-gray-900">${rule.rule}</td>
                        <td data-label="Support" class="py-4 px-6">${rule.support}</td>
                        <td data-label="Confidence" class="py-4 px-6">${rule.confidence}</td>
                        <td data-label="Lift" class="py-4 px-6">${rule.lift}</td>
                    </tr>
                `;
            });

            // Close table
            htmlContent += `
                        </tbody>
                    </table>
                </div>
            `;

            rulesOutputDiv.innerHTML = htmlContent;

        } else {
            // No rules found
            rulesOutputDiv.innerHTML = `
                <div class="bg-yellow-100 text-yellow-700 p-4 rounded-lg border-l-4 border-yellow-500 font-medium shadow-md">
                    <p>No association rules were found with the current parameters.</p>
                    <p class="mt-2 text-sm">Try reducing the Min Support or Min Confidence thresholds to find more rules.</p>
                </div>
            `;
        }
        
    </script>
</body>
</html>
